name: "Smokeping"
description: "Good old Smokeping to display ping statistics"
version: "latest"
slug: "smokeping"
image: linuxserver/smokeping
init: false
ports:
  80/tcp: 8085
arch:
  - aarch64
  - amd64
environment:
  PUID: "1000"
  PGID: "1000"
  TZ: Etc/UTC
map:
  type: addon_config
  read_only: False
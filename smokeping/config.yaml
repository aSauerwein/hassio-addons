name: "Smokeping"
description: "Good old Smokeping to display ping statistics"
version: "latest"
slug: "smokeping"
image: linuxserver/smokeping
init: false
ingress: true
ingress_port: 80
webui: http://[HOST]:[PORT:80]/smokeping
ingress_stream: false
arch:
  - aarch64
  - amd64
environment:
  PUID: "1000"
  PGID: "1000"
  TZ: Etc/UTC